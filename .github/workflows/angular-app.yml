name: CI-angular

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: "sqlite:///./test.db"
      SECRET_KEY: "ci-test-secret-key-32-characters-min"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/docs > /dev/null && exit 0
            sleep 2
          done
          echo "Backend did not start"; cat backend.log; exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular application
        working-directory: frontend
        run: npm run build
      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npx ng serve --port 4200 > frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4200 > /dev/null && echo "Frontend ready" && exit 0
            sleep 2
          done
          echo "Frontend did not start"; cat frontend.log; exit 1

      - name: Install Playwright Firefox
        working-directory: frontend
        run: npx playwright install --with-deps firefox

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --workers=1 --project=firefox

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 10