services:
  - type: web
    name: devmarket-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ping
    envVars:
      - key: CONNECTION_STRING
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DB_SSL
        value: "true"
      - key: CORS_ORIGINS
        sync: false
